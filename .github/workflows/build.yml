name: Build JodelPlus
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile JodelPlus dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -miphoneos-version-min=14.0 \
            -framework UIKit -framework Foundation -framework PhotosUI \
            -install_name @executable_path/Frameworks/JodelPlus.dylib \
            -o JodelPlus.dylib JodelPlus.m
          file JodelPlus.dylib

      - name: Compile ButtonFix dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -miphoneos-version-min=14.0 -framework UIKit -framework Foundation \
            -install_name @executable_path/Frameworks/ButtonFix.dylib \
            -o ButtonFix.dylib ButtonFix.m

      - uses: actions/upload-artifact@v4
        with:
          name: JodelPlus
          path: |
            JodelPlus.dylib
            ButtonFix.dylib
